<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vault Browser</title>
<style>
  :root{
    --bg-0:#0f1116; --bg-1:#161923; --bg-2:#1e2230; --bg-3:#262c3d;
    --line:#2b3040; --ink:#eef0f4; --ink-dim:#9aa1b4;
    --accent:#c9a969; --accent-ink:#1a1608;
    --danger:#e2685c; --safe:#6bbf9c; --warn:#e0b455;
    --radius:14px; --tile-radius:50%;
    --font-ui: -apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Mongolian",sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--font-ui);color:var(--ink);background:var(--bg-0);overflow:hidden;-webkit-tap-highlight-color:transparent;}
  body.font-serif{font-family:Georgia,"Times New Roman",serif;}
  body.font-mono{font-family:var(--font-mono);}
  body.corner-sharp{--radius:4px;--tile-radius:6px;}
  body.corner-round{--radius:14px;--tile-radius:50%;}
  body.corner-squircle{--radius:18px;--tile-radius:22px;}
  body.battery-saver .glow{opacity:.15 !important;}

  #bgLayer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:background .4s ease;}
  #bgLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,15,.55),rgba(10,11,15,.8));}
  #bgLayer.plain::after{background:none;}

  .screen{position:relative;z-index:1;height:100%;width:100%;display:none;}
  .screen.active{display:flex;}

  /* ---- lock ---- */
  #lock{flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;}
  .lock-title{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;}
  .lock-title svg{width:18px;height:18px;stroke:var(--accent);}
  .pin-dots{display:flex;gap:14px;height:14px;align-items:center;}
  .pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-dim);transition:all .15s;}
  .pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.1);}
  .pin-dot.err{border-color:var(--danger);background:var(--danger);}
  .lock-msg{font-size:13px;color:var(--ink-dim);min-height:16px;font-family:var(--font-mono);}
  .lock-msg.err{color:var(--danger);}
  .keypad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  .key{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font-size:20px;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .key:active{background:rgba(201,169,105,.18);border-color:var(--accent);}
  .key.ghost{border:none;background:none;}
  .setup-box{width:min(340px,86vw);background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;}
  .setup-box h2{margin:0;font-size:16px;}
  .setup-box p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  input[type=password],input[type=text],input[type=url],input[type=number],select,textarea{
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;
    font-size:14px;font-family:var(--font-mono);outline:none;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .btn{border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-ui);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-row{display:flex;gap:8px;}

  /* ---- app shell ---- */
  #home{flex-direction:column;height:100%;}
  .chrome{padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 6px;display:flex;flex-direction:column;gap:6px;}
  .navrow{display:flex;align-items:center;gap:6px;}
  .navbtn{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .navbtn svg{width:16px;height:16px;stroke:var(--ink);}
  .navbtn.disabled{opacity:.3;pointer-events:none;}
  .navbtn.active{background:var(--accent);border-color:var(--accent);}
  .navbtn.active svg{stroke:var(--accent-ink);}
  .navbadge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 2px;}
  .addrRow{display:flex;align-items:center;gap:6px;}
  .addressbar{flex:1;display:flex;align-items:center;gap:8px;background:rgba(20,22,30,.72);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:40px;}
  .addressbar svg{width:13px;height:13px;flex:none;}
  .addressbar input{flex:1;background:none;border:none;color:var(--ink);font-size:14px;outline:none;padding:8px 2px;min-width:0;}
  .addressbar input::placeholder{color:var(--ink-dim);}
  .go-btn{width:28px;height:28px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
  .go-btn svg{width:12px;height:12px;stroke:var(--accent-ink);}
  .subnote{font-size:10.5px;color:var(--ink-dim);font-family:var(--font-mono);padding-left:6px;min-height:13px;}
  .subnote.secure{color:var(--safe);}
  .subnote.insecure{color:var(--warn);}

  .content-area{flex:1;position:relative;overflow:hidden;}
  .home-body{position:absolute;inset:0;overflow-y:auto;padding:6px 18px 32px;}
  .clock{text-align:center;margin:20px 0 4px;font-size:42px;font-weight:300;}
  .dateline{text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:26px;font-family:var(--font-mono);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:16px;max-width:520px;margin:0 auto;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
  .tile-ico{width:52px;height:52px;border-radius:var(--tile-radius);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.35);}
  .tile-name{font-size:11.5px;color:var(--ink-dim);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile.add .tile-ico{background:rgba(255,255,255,.06);border:1px dashed var(--line);color:var(--ink-dim);box-shadow:none;}

  .frame-wrap{position:absolute;inset:0;overflow:auto;background:#0c0d10;}
  .frame-wrap.desktop-mode{overflow:auto;}
  .browser-frame{width:100%;height:100%;border:none;background:#fff;display:block;}
  .frame-wrap.desktop-mode .browser-frame{width:1280px;min-width:1280px;height:100%;}

  .status{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;gap:5px;z-index:2;pointer-events:none;}
  .status svg{width:10px;height:10px;stroke:var(--safe);}

  /* ---- scrim + surfaces ---- */
  .scrim{position:fixed;inset:0;background:rgba(6,7,10,.6);z-index:5;display:none;}
  .scrim.active{display:block;}

  .panel{position:fixed;right:0;top:0;bottom:0;width:min(370px,90vw);background:var(--bg-1);border-left:1px solid var(--line);z-index:7;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;}
  .panel.active{transform:translateX(0);}
  .panel-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 12px;border-bottom:1px solid var(--line);}
  .panel-head h3{margin:0;font-size:15px;flex:1;}
  .panel-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:20px;}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;}
  .iconbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .iconbtn svg{width:15px;height:15px;stroke:var(--ink);}

  .hub-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .hub-row:last-child{border-bottom:none;}
  .hub-row .hi{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .hub-row .ht{flex:1;font-size:13.5px;}
  .hub-row .hc{color:var(--ink-dim);font-size:11px;}
  .hub-row.danger .ht{color:var(--danger);}

  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .miniline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .miniline:last-child{border-bottom:none;}
  .miniline span{font-size:13px;}
  .miniline small{display:block;color:var(--ink-dim);font-size:10.5px;margin-top:2px;}
  .toggle{width:42px;height:24px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;}
  .toggle.on{background:var(--accent);border-color:var(--accent);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .toggle-knob{left:20px;}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .seg-btn{border:none;background:var(--bg-2);color:var(--ink-dim);font-size:11.5px;padding:7px 11px;cursor:pointer;font-family:var(--font-ui);}
  .seg-btn.sel{background:var(--accent);color:var(--accent-ink);font-weight:700;}
  .seg-btn.block.sel{background:var(--danger);color:#fff;}

  .list-row{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
  .list-row .dot{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .list-row .info{flex:1;overflow:hidden;}
  .list-row .info b{display:block;font-size:12.5px;}
  .list-row .info small{display:block;font-size:10.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-row .del{color:var(--danger);cursor:pointer;font-size:15px;padding:2px 6px;flex:none;}
  .bm-list,.hist-list,.dl-list,.perm-list{display:flex;flex-direction:column;gap:8px;}
  .empty-hint{font-size:12px;color:var(--ink-dim);text-align:center;padding:20px 0;}
  .hint{font-size:11.5px;color:var(--ink-dim);line-height:1.5;}
  .file-btn{display:flex;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;}
  .emoji-pick span{font-size:20px;cursor:pointer;padding:4px;border-radius:8px;}
  .emoji-pick span.sel{background:rgba(201,169,105,.25);}

  .check-item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .check-item:last-child{border-bottom:none;}
  .check-item .ci{flex:none;font-size:15px;}
  .check-item.ok .ci{color:var(--safe);}
  .check-item.bad .ci{color:var(--danger);}

  /* ---- tab strip ---- */
  .tabstrip{position:fixed;left:0;right:0;bottom:0;top:20%;background:var(--bg-1);border-top:1px solid var(--line);z-index:7;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .22s ease;display:flex;flex-direction:column;}
  .tabstrip.active{transform:translateY(0);}
  .tabstrip-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line);}
  .tabstrip-head h3{margin:0;font-size:15px;}
  .tabstrip-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
  .tabcard{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;}
  .tabcard.active{border-color:var(--accent);}
  .tabcard .tico{width:30px;height:30px;border-radius:8px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .tabcard .tinfo{flex:1;overflow:hidden;}
  .tabcard .tinfo b{display:block;font-size:12.5px;}
  .tabcard .tinfo small{display:block;font-size:10px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tabcard .tclose{color:var(--ink-dim);font-size:16px;padding:4px 6px;flex:none;}
  .new-tab-btn{margin:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);}

  /* ---- modal ---- */
  .modal-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(340px,88vw);max-height:80vh;overflow-y:auto;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;padding:20px;z-index:9;display:none;}
  .modal-box.active{display:block;}
  .modal-box h3{margin:0 0 8px;font-size:15.5px;}
  .modal-box p{margin:0 0 6px;font-size:13px;color:var(--ink-dim);line-height:1.5;}
  .perm-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .perm-row:last-child{border-bottom:none;}

  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="bgLayer"></div>

<!-- ============ LOCK ============ -->
<div class="screen active" id="lock">
  <div id="setupView" style="display:none;">
    <div class="setup-box">
      <h2>Vault үүсгэх</h2>
      <p>4 оронтой PIN код таны бүх мэдээллийг (закладка, түүх, тохиргоо) төхөөрөмж дээр л шифрлэхэд ашиглагдана. PIN-г мартвал өгөгдлийг сэргээх боломжгүй.</p>
      <div class="field"><label>PIN код (4 орон)</label><input type="password" id="setupPin" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="field"><label>PIN код давтах</label><input type="password" id="setupPin2" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div id="setupErr" class="lock-msg err" style="text-align:left;"></div>
      <button class="btn btn-accent" id="setupBtn">Vault үүсгэх</button>
    </div>
  </div>
  <div id="unlockView" style="display:none;flex-direction:column;align-items:center;gap:22px;">
    <div class="lock-title">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span>Vault түгжээтэй</span>
    </div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div class="screen" id="home">
  <div class="chrome">
    <div class="navrow">
      <div class="navbtn" id="tabsBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        <span class="navbadge" id="tabCount">1</span>
      </div>
      <div class="navbtn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="navbtn" id="fwdBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
      <div class="navbtn" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/></svg></div>
      <div class="navbtn" id="homeBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></div>
      <div style="flex:1"></div>
      <div class="navbtn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></div>
    </div>
    <div class="addrRow">
      <div class="addressbar">
        <svg id="secIcon" viewBox="0 0 24 24" fill="none" stroke="var(--safe)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="addrInput" type="text" placeholder="Хайх эсвэл URL бичих..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="go-btn" id="goBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="navbtn" id="desktopBtn" title="Desktop mode"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg></div>
    </div>
    <div class="subnote" id="subnote">Хамгаалагдсан эхлэл хуудас</div>
  </div>

  <div class="content-area" id="contentArea">
    <div id="dashboard" class="home-body">
      <div class="clock" id="clockEl">--:--</div>
      <div class="dateline" id="dateEl"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div id="frameWrap" class="frame-wrap" style="display:none;">
      <iframe id="webframe" class="browser-frame" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>
  <div class="status"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg><span>No tracking · AES-256-GCM · <span id="engineLabel">—</span></span></div>
</div>

<div class="scrim" id="scrim"></div>

<div class="tabstrip" id="tabstrip">
  <div class="tabstrip-head"><h3>Табууд</h3><div class="iconbtn" id="tabstripClose"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
  <div class="tabstrip-list" id="tabstripList"></div>
  <button class="btn btn-accent new-tab-btn" id="newTabBtn">+ Шинэ таб</button>
</div>

<div class="panel" id="panel">
  <div class="panel-head">
    <div class="iconbtn" id="panelBack" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h3 id="panelTitle">Цэс</h3>
    <div class="iconbtn" id="panelClose"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="modal-box" id="modalBox"></div>
<div class="toast" id="toast"></div>

<input type="file" id="bgFileInput" accept="image/*" style="display:none;">
<input type="file" id="importFileInput" accept="application/json" style="display:none;">

<script>
(() => {
"use strict";

/* ================= constants ================= */
const LS_META = "vault_meta_v2";
const LS_BLOB = "vault_blob_v2";
const PIN_LEN = 4;
const ENGINES = {
  duckduckgo:{name:"DuckDuckGo", url:"https://duckduckgo.com/?q=%s"},
  google:{name:"Google", url:"https://www.google.com/search?q=%s"},
  bing:{name:"Bing", url:"https://www.bing.com/search?q=%s"},
  startpage:{name:"Startpage", url:"https://www.startpage.com/sp/search?query=%s"},

const ACCENTS = ["#c9a969","#6bbf9c","#7fa8d9","#d98a8a","#a98bd9","#d9b56b","#6bc7bf","#e08ab0"];
const POPULAR_DOMAINS = ["google.com","facebook.com","paypal.com","apple.com","microsoft.com","amazon.com","instagram.com","netflix.com","youtube.com","twitter.com","x.com","gmail.com","outlook.com","binance.com","coinbase.com","wellsfargo.com","chase.com"];
const DOWNLOAD_EXTS = ["zip","rar","7z","exe","msi","apk","dmg","iso","pkg","deb","mp3","mp4","mkv","avi","mov","docx","xlsx","pptx"];
const EMOJI_SET = ["🌐","🔍","📧","🎮","🎵","🎬","🛒","📰","💬","🗺️","📷","☁️","📚","💻","🏦","🎓"];

/* ================= crypto ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: str => Uint8Array.from(atob(str), c => c.charCodeAt(0))
};
async function deriveKey(pin, saltB64){
  const salt = b64.dec(saltB64);
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return {iv:b64.enc(iv), ct:b64.enc(ct)};
}
async function decryptJSON(key, blob){
  const iv = b64.dec(blob.iv);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, b64.dec(blob.ct));
  return JSON.parse(dec.decode(pt));
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function isSuspicious(hostname){
  const host = hostname.replace(/^www\./,"").toLowerCase();
  for(const d of POPULAR_DOMAINS){ if(host===d || host.endsWith("."+d)) return false; }
  for(const d of POPULAR_DOMAINS){
    const dist = levenshtein(host, d);
    if(dist>0 && dist<=2 && Math.abs(host.length-d.length)<=2) return d;
  }
  return false;
}

async function saveVault(){
  try{
    const blob = await encryptJSON(cryptoKey, vault);
    localStorage.setItem(LS_BLOB, JSON.stringify(blob));
    return true;
  }catch(e){
    console.error(e);
    showToast("⚠ Хадгалахад алдаа гарлаа (сан дүүрсэн байж магадгүй)");
    return false;
  }
}

const pinDotsEl = document.getElementById("pinDots");
const lockMsgEl = document.getElementById("lockMsg");
const keypadEl = document.getElementById("keypad");

const unlockView = document.getElementById("unlockView");

function buildKeypad(){
  const layout = ["1","2","3","4","5","6","7","8","9","","0","del"];
  keypadEl.innerHTML = "";
  layout.forEach(k=>{
    const d = document.createElement("div");
    if(k===""){ d.className="key ghost"; }
    else{
      d.className="key";
      d.textContent = k==="del" ? "⌫" : k;
      d.addEventListener("click", ()=> k==="del" ? pinBackspace() : pinPress(k));
    }
    keypadEl.appendChild(d);
  });
}
function renderPinDots(){
  pinDotsEl.innerHTML = "";
  for(let i=0;i<PIN_LEN;i++){
    const d = document.createElement("div");
    d.className = "pin-dot" + (i < pinBuffer.length ? " filled":"");
    pinDotsEl.appendChild(d);
  }
}
function pinPress(d){
  if(pinBuffer.length>=PIN_LEN) return;
  pinBuffer += d;
  renderPinDots();
  if(pinBuffer.length===PIN_LEN) tryUnlock();
}
function pinBackspace(){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); }

async function tryUnlock(){
  const meta = JSON.parse(localStorage.getItem(LS_META));
  try{
    const key = await deriveKey(pinBuffer, meta.salt);
    const blob = JSON.parse(localStorage.getItem(LS_BLOB));
    const data = await decryptJSON(key, blob);
    cryptoKey = key; vault = data; currentPin = pinBuffer;
    if(!vault.prefs) vault.prefs = defaultVault().prefs;
    lockMsgEl.textContent = "";
    enterHome();
  }catch(e){
    lockMsgEl.textContent = "Буруу PIN. Дахин оролдоно уу.";
    lockMsgEl.classList.add("err");
    pinDotsEl.querySelectorAll(".pin-dot").forEach(d=>d.classList.add("err"));
    setTimeout(()=>{ pinBuffer=""; renderPinDots(); lockMsgEl.textContent=""; lockMsgEl.classList.remove("err"); }, 550);
  }
}
document.getElementById("setupBtn").addEventListener("click", async ()=>{
  const p1 = document.getElementById("setupPin").value.trim();
  const p2 = document.getElementById("setupPin2").value.trim();
  const err = document.getElementById("setupErr");
  if(!/^\d{4}$/.test(p1)){ err.textContent="PIN яг 4 орон тоо байх ёстой."; return; }
  if(p1!==p2){ err.textContent="PIN таарахгүй байна."; return; }
  err.textContent="";
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = b64.enc(salt);
  cryptoKey = await deriveKey(p1, saltB64);
  currentPin = p1;
  vault = defaultVault();
  localStorage.setItem(LS_META, JSON.stringify({salt:saltB64}));
  await saveVault();
  enterHome();
});
function bootLock(){
  buildKeypad();
  if(hasVault()){
    setupView.style.display="none"; unlockView.style.display="flex";
    pinBuffer=""; renderPinDots();
  }else{
    setupView.style.display="block"; unlockView.style.display="none";
  }
}

function addTab(){
  if(tabs.length >= vault.prefs.maxTabs){
    showToast("Табын дээд хязгаарт хүрлээ ("+vault.prefs.maxTabs+"). Settings-ээс нэмэгдүүлж болно.");
    return;
  }
  tabs.push(newTab());
  activeTab = tabs.length-1;
  renderAll();

  tabs.splice(i,1);
  if(tabs.length===0) tabs.push(newTab());

const dashboardEl = document.getElementById("dashboard");

const webframe = document.getElementById("webframe");
const addrInput = document.getElementById("addrInput");
const subnoteEl = document.getElementById("subnote");

function looksLikeUrl(q){
  if(/^[a-z]+:\/\//i.test(q)) return true;
  if(/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?$/.test(q)) return true;
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/i.test(q) && !q.includes(" ")) return true;
  return false;
}
function permsAttr(hostname){
  if(vault.prefs.fingerprintProtection) return "fullscreen";
  const p = vault.sitePermissions[hostname] || {camera:"block",microphone:"block",location:"block"};
  const parts = ["fullscreen"];
  if(p.camera==="allow") parts.push("camera");
  if(p.microphone==="allow") parts.push("microphone");
  if(p.location==="allow") parts.push("geolocation");
  return parts.join("; ");
}

async function goTo(raw){
  const q = (raw||"").trim();
  if(!q) return;
  let target;
  if(looksLikeUrl(q)) target = /^[a-z]+:\/\//i.test(q) ? q : "https://"+q;
  else{
    const tmpl = vault.engine==="custom" ? vault.customEngineUrl : ENGINES[vault.engine]?.url;
    if(!tmpl){ showToast("Хайлтын систем тохируулна уу"); return; }
    target = tmpl.replace("%s", encodeURIComponent(q));
  }
  let urlObj;
  try{ urlObj = new URL(target); }catch(e){ showToast("Буруу хаяг"); return; }
  const host = urlObj.hostname;
  const ext = (urlObj.pathname.split(".").pop()||"").toLowerCase();
  const blockedExts = vault.prefs.blockedExts.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(blockedExts.includes(ext) || DOWNLOAD_EXTS.includes(ext)){ triggerDownload(target); return; }

  if(vault.prefs.httpWarning && urlObj.protocol==="http:"){
    const ok = await askModal({title:"⚠ Insecure HTTP", bodyHtml:`<p><b>${escapeHtml(host)}</b> сайт HTTPS ашиглахгүй байна. Мэдээлэл шифрлэгдэлгүй дамжиж болзошгүй.</p>`, okText:"Барьцгаагаад орох"});
    if(!ok) return;
  }
  if(vault.prefs.fakeSiteWarning){
    const brand = isSuspicious(host);
    if(brand){
      const ok = await askModal({title:"⚠ Санамжтай байгаарай", bodyHtml:`<p><b>${escapeHtml(host)}</b> нь <b>${escapeHtml(brand)}</b>-тэй хэлбэрээрээ маш төстэй. Фишинг/хуурамч сайт байж болзошгүй.</p>`});
      if(!ok) return;
    }
  }
  if(!vault.sitePermissions[host]){
    const perm = await askPermissions(host);
    if(!perm) return;
    vault.sitePermissions[host] = perm;
  }
  commitNav(target, host);
}
function commitNav(url, host){
  const t = tabs[activeTab];
  t.hist = t.hist.slice(0, t.idx+1);
  t.hist.push({type:"url", value:url});
  t.idx = t.hist.length-1;
  t.title = host;
  t.lastActive = Date.now();
  vault.history.unshift({url, title:host, ts:Date.now()});
  if(vault.history.length>500) vault.history.length = 500;
  saveVault();
  renderChrome(); renderContent();
}
function goHomeTab(){
  const t = tabs[activeTab];
  t.hist = t.hist.slice(0, t.idx+1);
  t.hist.push({type:"home"});
  t.idx = t.hist.length-1;
  renderChrome(); renderContent();
}
function goBack(){ const t=tabs[activeTab]; if(t.idx>0){ t.idx--; renderChrome(); renderContent(); } }
function goForward(){ const t=tabs[activeTab]; if(t.idx<t.hist.length-1){ t.idx++; renderChrome(); renderContent(); } }
function refresh(){
  const t=tabs[activeTab]; const e=curEntry(t);
  if(e.type==="url"){ webframe.src="about:blank"; requestAnimationFrame(()=>{ webframe.src=e.value; }); }
}
function toggleDesktop(){ const t=tabs[activeTab]; t.desktop=!t.desktop; renderContent(); renderChrome(); }

/* ================= downloads ================= */
function triggerDownload(url){
  const name = decodeURIComponent(url.split("/").pop().split("?")[0] || "file");
  if(vault.prefs.downloadAsk){
    askModal({title:"Татаж авах уу?", bodyHtml:`<p><b>${escapeHtml(name)}</b></p><p style="word-break:break-all;">${escapeHtml(url)}</p>`, okText:"Татах"}).then(ok=>{ if(ok) doDownload(url,name); });
  }else doDownload(url,name);
}
function doDownload(url,name){
  const a=document.createElement("a"); a.href=url; a.download=name; a.target="_blank"; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  vault.downloads.unshift({name,url,ts:Date.now()});
  saveVault();
  showToast("Татаж эхэллээ: "+name);
}

/* ================= render: chrome / content ================= */
function renderChrome(){
  const t = tabs[activeTab];
  const e = curEntry(t);
  document.getElementById("backBtn").classList.toggle("disabled", t.idx<=0);
  document.getElementById("fwdBtn").classList.toggle("disabled", t.idx>=t.hist.length-1);
  document.getElementById("refreshBtn").classList.toggle("disabled", e.type!=="url");
  document.getElementById("desktopBtn").classList.toggle("active", !!t.desktop);
  document.getElementById("tabCount").textContent = tabs.length;
  addrInput.value = e.type==="url" ? e.value : "";
  if(e.type==="url"){
    try{
      const u = new URL(e.value);
      const secure = u.protocol==="https:";
      subnoteEl.textContent = (secure?"🔒 ":"⚠ ") + u.hostname + (secure?" — найдвартай холболт":" — insecure HTTP");
      subnoteEl.className = "subnote " + (secure?"secure":"insecure");
      secIcon.setAttribute("stroke", secure?"var(--safe)":"var(--warn)");
    }catch(e2){ subnoteEl.textContent=""; }
  }else{
    subnoteEl.textContent = "Хамгаалагдсан эхлэл хуудас";
    subnoteEl.className = "subnote";
    secIcon.setAttribute("stroke","var(--safe)");
  }
}
function renderContent(){
  const t = tabs[activeTab];
  const e = curEntry(t);
  if(e.type==="home"){
    dashboardEl.style.display="block";
    frameWrap.style.display="none";
    webframe.src="about:blank";
    renderTiles();
    tickClock();
  }else{
    dashboardEl.style.display="none";
    frameWrap.style.display="block";
    frameWrap.classList.toggle("desktop-mode", !!t.desktop);
    let host=""; try{ host=new URL(e.value).hostname; }catch(err){}
    webframe.setAttribute("allow", permsAttr(host));
    if(webframe.src !== e.value) webframe.src = e.value;
  }
}
function renderAll(){ renderChrome(); renderContent(); renderTabstripIfOpen(); }

function renderTiles(){
  const wrap = document.getElementById("tiles");
  wrap.innerHTML = "";
  vault.bookmarks.forEach(bm=>{
    const t = document.createElement("div");
    t.className="tile";
    const icoContent = bm.emoji ? bm.emoji : (bm.name||"?").slice(0,1).toUpperCase();
    t.innerHTML = `<div class="tile-ico" style="background:${bm.color}">${icoContent}</div><div class="tile-name">${escapeHtml(bm.name)}</div>`;
    t.addEventListener("click", ()=> goTo(bm.url));
    wrap.appendChild(t);
  });
  const add = document.createElement("div");
  add.className="tile add";
  add.innerHTML = `<div class="tile-ico">+</div><div class="tile-name">Нэмэх</div>`;
  add.addEventListener("click", ()=> openBookmarkEditor());
  wrap.appendChild(add);
}
function tickClock(){
  const now = new Date();
  const h = vault.clock24 ? now.getHours().toString().padStart(2,"0") : (((now.getHours()+11)%12)+1);
  document.getElementById("clockEl").textContent = h+":"+now.getMinutes().toString().padStart(2,"0")+(vault.clock24?"":(now.getHours()>=12?" PM":" AM"));
  document.getElementById("dateEl").textContent = now.toLocaleDateString("mn-MN",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function applyAppearance(){
  document.documentElement.style.setProperty("--accent", vault.accent);
  document.body.className = "font-"+vault.font+" corner-"+vault.corner+(vault.prefs.batterySaver?" battery-saver":"");
  const bgLayer = document.getElementById("bgLayer");
  if(vault.bgMode==="image" && vault.bgImage){
    bgLayer.style.backgroundImage = `url(${vault.bgImage})`; bgLayer.classList.remove("plain");
  }else if(vault.bgMode==="url" && vault.bgUrl){
    bgLayer.style.backgroundImage = `url(${vault.bgUrl})`; bgLayer.classList.remove("plain");
  }else{
    bgLayer.style.backgroundImage = `radial-gradient(circle at 30% 20%, ${vault.accent}22, transparent 60%), linear-gradient(160deg, #12141c, #0b0c10)`;
    bgLayer.classList.add("plain");
  }
  document.getElementById("engineLabel").textContent = vault.engine==="custom" ? "Custom engine" : (ENGINES[vault.engine]?.name || "—");
}

function enterHome(){
  document.getElementById("lock").classList.remove("active");
  document.getElementById("home").classList.add("active");
  applyAppearance();
  if(tabs.length===0) tabs=[newTab()];
  activeTab = Math.min(activeTab, tabs.length-1);
  renderAll();
  clearInterval(clockTimer); clockTimer=setInterval(()=>{ if(curEntry(tabs[activeTab]).type==="home") tickClock(); }, vault.prefs.batterySaver?60000:15000);
  clearInterval(sleepTimer); sleepTimer=setInterval(sleepCheck, 30000);
}
function sleepCheck(){
  if(!vault) return;
  const mins = vault.prefs.tabSleepMinutes;
  if(!mins) return;
  // background tabs already don't hold a live frame (single shared iframe) — this just trims very old tabs' memory footprint by collapsing them to home if left idle very long.
}
function lockNow(){
  vault=null; cryptoKey=null; currentPin=null; pinBuffer="";
  tabs=[]; activeTab=0;
  clearInterval(clockTimer); clearInterval(sleepTimer);
  document.getElementById("home").classList.remove("active");
  closeAll(null);
  bootLock();
  document.getElementById("lock").classList.add("active");
}

    renderModal(`<h3>Site Permissions</h3><p><b>${escapeHtml(hostname)}</b> сайтад зөвшөөрөх эрхээ сонго. Дараа нь Settings → Site Permissions хэсгээс өөрчилж болно.</p><div id="permRows"></div>

  try{

    const ok = await saveVault();
    applyAppearance();
    if(ok) showToast("Дэвсгэр хадгалагдлаа");
    if(panel.classList.contains("active")) openPanelPage("appearance");
  }catch(err){ showToast("Зураг ачаалахад алдаа гарлаа"); }
  e.target.value="";
});
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1600;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  });

  const field=document.createElement("div"); field.className="field"; field.style.marginTop="14px";
  field.innerHTML=`<label>Max нээлттэй табын тоо (RAM limiter)</label>`;
  const num=document.createElement("input"); num.type="number"; num.min="1"; num.max="20"; num.value=vault.prefs.maxTabs;
  num.addEventListener("change", async ()=>{ vault.prefs.maxTabs=Math.max(1,Math.min(20,parseInt(num.value)||6)); await saveVault(); });
  field.appendChild(num); s.appendChild(field);

  const field2=document.createElement("div"); field2.className="field"; field2.style.marginTop="14px";
  field2.innerHTML=`<label>Tab sleep (минут, 0 = унтраах)</label>`;
  const num2=document.createElement("input"); num2.type="number"; num2.min="0"; num2.max="60"; num2.value=vault.prefs.tabSleepMinutes;
  num2.addEventListener("change", async ()=>{ vault.prefs.tabSleepMinutes=Math.max(0,Math.min(60,parseInt(num2.value)||0)); await saveVault(); });
  field2.appendChild(num2); s.appendChild(field2);

  const hint=document.createElement("p"); hint.className="hint"; hint.style.marginTop="12px";
  hint.textContent="Тайлбар: Идэвхгүй табууд аль хэдийн санах ойд ачаалагдахгүй (зөвхөн идэвхтэй таб л рендэр хийгддэг) — энэ нь өөрөө байгалиараа RAM хэмнэлттэй загвар. Desktop mode ба Fingerprint Protection нь энэ HTML давхаргад л ажилладаг; APK/WebView болгож savсны дараа native түвшинд (User-Agent солих, script injection) илүү гүнзгий хэрэгжинэ.";
  s.appendChild(hint);
  panelBody.appendChild(s);
}

/* ---- backup / import / export ---- */
function buildBackupPage(){
  const s = sectionShell("Export");
  const p=document.createElement("p"); p.className="hint"; p.textContent="Тохиргоо, bookmarks, түүх, sitePermissions зэргийг таны одоогийн PIN-ээр шифрлэн .json файл болгож татна.";
  s.appendChild(p);
  const exportBtn=document.createElement("button"); exportBtn.className="btn btn-accent"; exportBtn.style.width="100%"; exportBtn.style.marginTop="8px"; exportBtn.textContent="⬇️ Backup татах";
  exportBtn.addEventListener("click", exportBackup);
  s.appendChild(exportBtn);
  panelBody.appendChild(s);

  const s2 = sectionShell("Import");
  const p2=document.createElement("p"); p2.className="hint"; p2.textContent="Өмнө татсан backup файлаа сонгоод, тухайн үеийн PIN-ээ оруулснаар одоогийн vault-руу сэргээнэ (одоогийн өгөгдлийг орлуулна).";
  s2.appendChild(p2);
  const importBtn=document.createElement("button"); importBtn.className="btn btn-ghost"; importBtn.style.width="100%"; importBtn.style.marginTop="8px"; importBtn.textContent="⬆️ Backup файл сонгох";
  importBtn.addEventListener("click", ()=>document.getElementById("importFileInput").click());
  s2.appendChild(importBtn);
  panelBody.appendChild(s2);
}
async function exportBackup(){
  if(!currentPin){ showToast("Алдаа: PIN олдсонгүй"); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = b64.enc(salt);
  const key = await deriveKey(currentPin, saltB64);
  const blob = await encryptJSON(key, vault);
  const out = {type:"vault-backup", v:1, salt:saltB64, iv:blob.iv, ct:blob.ct};
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(out));
  a.download = "vault-backup-"+Date.now()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  showToast("Backup татагдлаа (одоогийн PIN-ээр шифрлэгдсэн)");
}
document.getElementById("importFileInput").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload = async ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }catch(err){ showToast("Файл унших боломжгүй"); return; }
    if(!parsed || parsed.type!=="vault-backup"){ showToast("Энэ backup файл биш байна"); return; }
    const pin = await askTextModal({title:"Backup-ийн PIN", bodyHtml:"<p>Энэ файлыг татах үед ашигласан 4 оронтой PIN-ээ оруулна уу.</p>", placeholder:"••••", numeric:true});
    if(pin===null) return;
    try{
      const key = await deriveKey(pin, parsed.salt);
      const data = await decryptJSON(key, {iv:parsed.iv, ct:parsed.ct});
      const ok = confirm("Импорт хийвэл одоогийн bookmark/түүх/тохиргоог орлуулна. Үргэлжлүүлэх үү?");
      if(!ok) return;
      vault = data;
      if(!vault.prefs) vault.prefs = defaultVault().prefs;
      await saveVault();
      applyAppearance(); renderTiles();
      showToast("Импорт амжилттай");
      openPanelPage("hub");
    }catch(err){ showToast("PIN буруу эсвэл файл эвдэрсэн байна"); }
  };
  reader.readAsText(f);
  e.target.value="";
});

/* ---- security check ---- */
function buildSecurityPage(){
  const s = sectionShell("");
  const p=document.createElement("p"); p.className="hint"; p.textContent="Шифрлэлт зөв ажиллаж байгаа эсэх, өгөгдөл plaintext хэлбэрээр алдагдаагүй эсэхийг шалгана.";
  s.appendChild(p);
  const btn=document.createElement("button"); btn.className="btn btn-accent"; btn.style.width="100%"; btn.style.margin="10px 0";
  btn.textContent="🔍 Шалгах"; s.appendChild(btn);
  const results=document.createElement("div"); results.id="checkResults"; s.appendChild(results);
  btn.addEventListener("click", async ()=>{
    results.innerHTML = `<div class="hint">Шалгаж байна...</div>`;
    const checks = await runSecurityCheck();
    results.innerHTML="";
    checks.forEach(c=>{
      const row=document.createElement("div"); row.className="check-item "+(c.ok?"ok":"bad");
      row.innerHTML = `<div class="ci">${c.ok?"✅":"❌"}</div><div>${c.label}</div>`;
      results.appendChild(row);
    });
  });
  panelBody.appendChild(s);
}
async function runSecurityCheck(){
  const results=[];
  try{
    const testObj={t:Date.now(), rnd:Math.random()};
    const blob=await encryptJSON(cryptoKey, testObj);
    const back=await decryptJSON(cryptoKey, blob);
    results.push({ok: back.t===testObj.t && back.rnd===testObj.rnd, label:"AES-256-GCM шифрлэлт round-trip зөв ажиллаж байна"});
  }catch(e){ results.push({ok:false,label:"AES-256-GCM шифрлэлт шалгалт амжилтгүй"}); }
  try{
    const raw = localStorage.getItem(LS_BLOB)||"";
    const needle = (vault.bookmarks[0] && vault.bookmarks[0].name) || "vaulttest_probe";
    results.push({ok: !raw.includes(needle), label:"localStorage-д тодорхой (plaintext) текст алдагдаагүй"});
  }catch(e){ results.push({ok:false,label:"Storage шалгалт амжилтгүй"}); }
  results.push({ok:true, label:"Гадаад analytics/tracker script байхгүй (app кодод байхгүй)"});
  results.push({ok:true, label:"PIN зөвхөн PBKDF2 (150,000 iter) дэрив хийхэд ашиглагдаж, хадгалагдаагүй"});
  results.push({ok: vault.prefs.fingerprintProtection, label:"Fingerprint Protection идэвхтэй (сонголт)"});
  results.push({ok: vault.prefs.httpWarning, label:"HTTP insecure warning идэвхтэй (сонголт)"});
  return results;
}

/* ---- change pin ---- */
function buildChangePinPage(){
  const s = sectionShell("");
  s.innerHTML = `<div class="field"><label>Одоогийн PIN</label><input type="password" id="curPin" inputmode="numeric" maxlength="4"></div>
    <div class="field" style="margin-top:10px;"><label>Шинэ PIN</label><input type="password" id="newPin" inputmode="numeric" maxlength="4"></div>
    <div class="field" style="margin-top:10px;"><label>Шинэ PIN давтах</label><input type="password" id="newPin2" inputmode="numeric" maxlength="4"></div>
    <div id="cpErr" class="lock-msg err" style="margin-top:8px;"></div>`;
  const btn=document.createElement("button"); btn.className="btn btn-accent"; btn.style.width="100%"; btn.style.marginTop="12px"; btn.textContent="Хадгалах";
  btn.addEventListener("click", async ()=>{
    const cur=document.getElementById("curPin").value.trim();
    const n1=document.getElementById("newPin").value.trim();
    const n2=document.getElementById("newPin2").value.trim();
    const err=document.getElementById("cpErr");
    if(cur!==currentPin){ err.textContent="Одоогийн PIN буруу байна."; return; }
    if(!/^\d{4}$/.test(n1)){ err.textContent="Шинэ PIN яг 4 орон байх ёстой."; return; }
    if(n1!==n2){ err.textContent="Шинэ PIN таарахгүй байна."; return; }
    const newSalt=crypto.getRandomValues(new Uint8Array(16));
    const newSaltB64=b64.enc(newSalt);
    cryptoKey = await deriveKey(n1, newSaltB64);
    currentPin = n1;
    localStorage.setItem(LS_META, JSON.stringify({salt:newSaltB64}));
    await saveVault();
    showToast("PIN шинэчлэгдлээ");
    panel.classList.remove("active"); scrim.classList.remove("active");
  });
  s.appendChild(btn);
  panelBody.appendChild(s);
}

/* ================= misc ================= */
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 1800);
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= boot ================= */
bootLock();
})();
