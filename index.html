<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vault — Secure Start</title>
<style>
  :root{
    --bg-0:#0f1116;
    --bg-1:#161923;
    --bg-2:#1e2230;
    --line:#2b3040;
    --ink:#eef0f4;
    --ink-dim:#9aa1b4;
    --accent:#c9a969;
    --accent-ink:#1a1608;
    --danger:#e2685c;
    --safe:#6bbf9c;
    --radius:14px;
    --font-ui: -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Mongolian", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-ui);
    color:var(--ink);
    background:var(--bg-0);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #bgLayer{
    position:fixed;inset:0;z-index:0;
    background-size:cover;background-position:center;
    transition:background .4s ease;
  }
  #bgLayer::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,11,15,.55), rgba(10,11,15,.78));
  }
  #bgLayer.plain::after{ background:none; }

  .screen{
    position:relative;z-index:1;
    height:100%;width:100%;
    display:none;
  }
  .screen.active{display:flex;}

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;
  }
  .lock-title{
    display:flex;align-items:center;gap:10px;
    color:var(--ink);font-size:15px;letter-spacing:.02em;
  }
  .lock-title svg{width:18px;height:18px;stroke:var(--accent);}
  .pin-dots{display:flex;gap:14px;height:14px;align-items:center;}
  .pin-dot{
    width:12px;height:12px;border-radius:50%;
    border:1.5px solid var(--ink-dim);
    transition:background .15s, border-color .15s, transform .15s;
  }
  .pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.1);}
  .pin-dot.err{border-color:var(--danger);background:var(--danger);}
  .lock-msg{font-size:13px;color:var(--ink-dim);min-height:16px;font-family:var(--font-mono);}
  .lock-msg.err{color:var(--danger);}
  .keypad{
    display:grid;grid-template-columns:repeat(3,64px);gap:14px;
  }
  .key{
    width:64px;height:64px;border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,.03);
    color:var(--ink);font-size:20px;font-family:var(--font-mono);
    display:flex;align-items:center;justify-content:center;
    user-select:none;cursor:pointer;
  }
  .key:active{background:rgba(201,169,105,.18);border-color:var(--accent);}
  .key.ghost{border:none;background:none;}
  .setup-box{
    width:min(340px,86vw);
    background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;display:flex;flex-direction:column;gap:12px;
  }
  .setup-box h2{margin:0;font-size:16px;font-weight:600;}
  .setup-box p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  input[type=password],input[type=text],input[type=url],select{
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-size:14px;font-family:var(--font-mono);
    outline:none;
  }
  input[type=password]:focus,input[type=text]:focus,input[type=url]:focus,select:focus{border-color:var(--accent);}
  .btn{
    border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:var(--font-ui);
  }
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-row{display:flex;gap:8px;}

  /* ---------- HOME SCREEN ---------- */
  #home{flex-direction:column;height:100%;}
  .topbar{
    display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px;
  }
  .iconbtn{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .iconbtn svg{width:17px;height:17px;stroke:var(--ink);}
  .addressbar{
    flex:1;display:flex;align-items:center;gap:8px;
    background:rgba(20,22,30,.72);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:999px;
    padding:0 8px 0 14px;height:44px;
  }
  .addressbar svg{width:14px;height:14px;stroke:var(--safe);flex:none;}
  .addressbar input{
    flex:1;background:none;border:none;color:var(--ink);font-size:14.5px;
    outline:none;padding:8px 4px;
  }
  .addressbar input::placeholder{color:var(--ink-dim);}
  .go-btn{
    width:30px;height:30px;border-radius:50%;background:var(--accent);
    border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;
  }
  .go-btn svg{width:13px;height:13px;stroke:var(--accent-ink);}

  .home-body{flex:1;overflow-y:auto;padding:10px 18px 32px;}
  .clock{text-align:center;margin:26px 0 6px;font-size:44px;font-weight:300;letter-spacing:.02em;}
  .dateline{text-align:center;color:var(--ink-dim);font-size:13px;margin-bottom:30px;font-family:var(--font-mono);}

  .tiles{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
    gap:16px;max-width:520px;margin:0 auto;
  }
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  }
  .tile-ico{
    width:52px;height:52px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;font-weight:700;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .tile-name{font-size:11.5px;color:var(--ink-dim);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile.add .tile-ico{background:rgba(255,255,255,.06);border:1px dashed var(--line);color:var(--ink-dim);box-shadow:none;}

  .status{
    position:fixed;bottom:10px;left:0;right:0;text-align:center;
    font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;gap:6px;z-index:2;
  }
  .status svg{width:11px;height:11px;stroke:var(--safe);}

  /* ---------- PANEL (settings / bookmark editor) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(6,7,10,.55);z-index:5;
    display:none;
  }
  .overlay.active{display:block;}
  .panel{
    position:fixed;right:0;top:0;bottom:0;width:min(360px,88vw);
    background:var(--bg-1);border-left:1px solid var(--line);
    z-index:6;transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .panel.active{transform:translateX(0);}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h3{margin:0;font-size:15px;}
  .panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px;}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .miniline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .miniline:last-child{border-bottom:none;}
  .miniline span{font-size:13.5px;}
  .toggle{
    width:42px;height:24px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:none;
  }
  .toggle.on{background:var(--accent);border-color:var(--accent);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .toggle-knob{left:20px;}
  .bm-list{display:flex;flex-direction:column;gap:8px;}
  .bm-row{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .bm-row .dot{width:22px;height:22px;border-radius:6px;flex:none;}
  .bm-row .info{flex:1;overflow:hidden;}
  .bm-row .info b{display:block;font-size:12.5px;}
  .bm-row .info small{display:block;font-size:10.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bm-row .del{color:var(--danger);cursor:pointer;font-size:16px;padding:2px 6px;}
  .hint{font-size:11.5px;color:var(--ink-dim);line-height:1.5;}
  .file-btn{display:flex;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;}
  .toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:20;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="bgLayer"></div>

<!-- ============ LOCK / SETUP SCREEN ============ -->
<div class="screen active" id="lock">

  <div id="setupView" style="display:none;">
    <div class="setup-box">
      <h2>Хамгаалалт тохируулах</h2>
      <p>PIN код нь таны хадгалсан бүх мэдээллийг (закладка, тохиргоо) шифрлэхэд ашиглагдана. PIN-г мартвал өгөгдлийг сэргээх боломжгүй тул сайн санаарай.</p>
      <div class="field">
        <label>PIN код (4–8 орон)</label>
        <input type="password" id="setupPin" inputmode="numeric" maxlength="8" placeholder="••••">
      </div>
      <div class="field">
        <label>PIN код давтах</label>
        <input type="password" id="setupPin2" inputmode="numeric" maxlength="8" placeholder="••••">
      </div>
      <div id="setupErr" class="lock-msg err" style="text-align:left;"></div>
      <div class="btn-row">
        <button class="btn btn-accent" style="flex:1" id="setupBtn">Vault үүсгэх</button>
      </div>
    </div>
  </div>

  <div id="unlockView" style="display:none;flex-direction:column;align-items:center;gap:22px;">
    <div class="lock-title">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span>Vault түгжээтэй</span>
    </div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="keypad" id="keypad"></div>
  </div>

</div>

<!-- ============ HOME SCREEN ============ -->
<div class="screen" id="home">
  <div class="topbar">
    <div class="iconbtn" id="lockBtn" title="Түгжих">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div class="addressbar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <input id="addrInput" type="text" placeholder="Хайх эсвэл URL бичих..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="go-btn" id="goBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="iconbtn" id="settingsBtn" title="Тохиргоо">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <div class="home-body">
    <div class="clock" id="clockEl">--:--</div>
    <div class="dateline" id="dateEl"></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="status">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
    <span>No tracking · AES-GCM encrypted · <span id="engineLabel">—</span></span>
  </div>
</div>

<!-- overlay + settings panel -->
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <h3 id="panelTitle">Тохиргоо</h3>
    <div class="iconbtn" id="panelClose">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

/* ================= constants ================= */
const LS_META = "vault_meta_v1";     // {salt}
const LS_BLOB = "vault_blob_v1";     // {iv, ct}
const ENGINES = {
  duckduckgo:{name:"DuckDuckGo", url:"https://duckduckgo.com/?q=%s"},
  google:{name:"Google", url:"https://www.google.com/search?q=%s"},
  bing:{name:"Bing", url:"https://www.bing.com/search?q=%s"},
  startpage:{name:"Startpage", url:"https://www.startpage.com/sp/search?query=%s"},
  ecosia:{name:"Ecosia", url:"https://www.ecosia.org/search?q=%s"},
  brave:{name:"Brave Search", url:"https://search.brave.com/search?q=%s"}
};
const ACCENTS = ["#c9a969","#6bbf9c","#7fa8d9","#d98a8a","#a98bd9","#d9b56b"];

let vault = null;          // decrypted state (in-memory only)
let cryptoKey = null;      // CryptoKey (in-memory only)
let pinBuffer = "";

/* ================= crypto helpers ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: str => Uint8Array.from(atob(str), c => c.charCodeAt(0))
};
async function deriveKey(pin, saltB64){
  const salt = b64.dec(saltB64);
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return {iv:b64.enc(iv), ct:b64.enc(ct)};
}
async function decryptJSON(key, blob){
  const iv = b64.dec(blob.iv);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, b64.dec(blob.ct));
  return JSON.parse(dec.decode(pt));
}

/* ================= default vault ================= */
function defaultVault(){
  return {
    accent:"#c9a969",
    bgMode:"plain",      // plain | image
    bgImage:"",           // base64 data URL
    engine:"duckduckgo",
    customEngineUrl:"",
    bookmarks:[
      {name:"DuckDuckGo", url:"https://duckduckgo.com", color:"#de5833"},
      {name:"Wikipedia", url:"https://wikipedia.org", color:"#6bbf9c"},
      {name:"GitHub", url:"https://github.com", color:"#7fa8d9"}
    ]
  };
}

/* ================= persistence ================= */
async function saveVault(){
  const blob = await encryptJSON(cryptoKey, vault);
  localStorage.setItem(LS_BLOB, JSON.stringify(blob));
}
function hasVault(){ return !!localStorage.getItem(LS_META); }

/* ================= UI: lock screen ================= */
const pinDotsEl = document.getElementById("pinDots");
const lockMsgEl = document.getElementById("lockMsg");
const keypadEl = document.getElementById("keypad");

function buildKeypad(){
  const layout = ["1","2","3","4","5","6","7","8","9","","0","del"];
  keypadEl.innerHTML = "";
  layout.forEach(k=>{
    const d = document.createElement("div");
    if(k===""){ d.className="key ghost"; }
    else{
      d.className="key";
      d.textContent = k==="del" ? "⌫" : k;
      d.addEventListener("click", ()=> k==="del" ? pinBackspace() : pinPress(k));
    }
    keypadEl.appendChild(d);
  });
}
function renderPinDots(len){
  pinDotsEl.innerHTML = "";
  for(let i=0;i<len;i++){
    const d = document.createElement("div");
    d.className = "pin-dot" + (i < pinBuffer.length ? " filled":"");
    pinDotsEl.appendChild(d);
  }
}
function pinPress(d){
  if(pinBuffer.length>=8) return;
  pinBuffer += d;
  renderPinDots(Math.max(4, pinBuffer.length));
  if(pinBuffer.length>=4) tryUnlockDebounced();
}
function pinBackspace(){
  pinBuffer = pinBuffer.slice(0,-1);
  renderPinDots(Math.max(4, pinBuffer.length));
}
let unlockTimer=null;
function tryUnlockDebounced(){
  clearTimeout(unlockTimer);
  unlockTimer = setTimeout(tryUnlock, 260);
}
async function tryUnlock(){
  const meta = JSON.parse(localStorage.getItem(LS_META));
  try{
    const key = await deriveKey(pinBuffer, meta.salt);
    const blobRaw = localStorage.getItem(LS_BLOB);
    const blob = JSON.parse(blobRaw);
    const data = await decryptJSON(key, blob);
    cryptoKey = key;
    vault = data;
    lockMsgEl.textContent = "";
    enterHome();
  }catch(e){
    lockMsgEl.textContent = "Буруу PIN. Дахин оролдоно уу.";
    lockMsgEl.classList.add("err");
    pinDotsEl.querySelectorAll(".pin-dot").forEach(d=>d.classList.add("err"));
    setTimeout(()=>{
      pinBuffer="";
      renderPinDots(4);
      lockMsgEl.textContent="";
      lockMsgEl.classList.remove("err");
    }, 550);
  }
}

/* ================= setup flow ================= */
const setupView = document.getElementById("setupView");
const unlockView = document.getElementById("unlockView");
document.getElementById("setupBtn").addEventListener("click", async ()=>{
  const p1 = document.getElementById("setupPin").value.trim();
  const p2 = document.getElementById("setupPin2").value.trim();
  const err = document.getElementById("setupErr");
  if(!/^\d{4,8}$/.test(p1)){ err.textContent="PIN нь 4–8 орны тоо байх ёстой."; return; }
  if(p1!==p2){ err.textContent="PIN таарахгүй байна."; return; }
  err.textContent="";
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const saltB64 = b64.enc(salt);
  const key = await deriveKey(p1, saltB64);
  cryptoKey = key;
  vault = defaultVault();
  localStorage.setItem(LS_META, JSON.stringify({salt:saltB64}));
  await saveVault();
  enterHome();
});

/* ================= boot ================= */
function bootLock(){
  buildKeypad();
  if(hasVault()){
    setupView.style.display="none";
    unlockView.style.display="flex";
    pinBuffer="";
    renderPinDots(4);
  }else{
    setupView.style.display="block";
    unlockView.style.display="none";
  }
}

/* ================= home screen ================= */
const homeScreen = document.getElementById("home");
const lockScreen = document.getElementById("lock");
const bgLayer = document.getElementById("bgLayer");

function applyAppearance(){
  document.documentElement.style.setProperty("--accent", vault.accent);
  if(vault.bgMode==="image" && vault.bgImage){
    bgLayer.style.backgroundImage = `url(${vault.bgImage})`;
    bgLayer.classList.remove("plain");
  }else{
    bgLayer.style.backgroundImage = `radial-gradient(circle at 30% 20%, ${vault.accent}22, transparent 60%), linear-gradient(160deg, #12141c, #0b0c10)`;
    bgLayer.classList.add("plain");
  }
  document.getElementById("engineLabel").textContent =
    vault.engine==="custom" ? "Custom engine" : (ENGINES[vault.engine]?.name || "—");
}

function renderTiles(){
  const wrap = document.getElementById("tiles");
  wrap.innerHTML = "";
  vault.bookmarks.forEach((bm, idx)=>{
    const t = document.createElement("div");
    t.className="tile";
    t.innerHTML = `<div class="tile-ico" style="background:${bm.color}">${(bm.name||"?").slice(0,1).toUpperCase()}</div><div class="tile-name">${escapeHtml(bm.name)}</div>`;
    t.addEventListener("click", ()=> navigateTo(bm.url));
    wrap.appendChild(t);
  });
  const add = document.createElement("div");
  add.className="tile add";
  add.innerHTML = `<div class="tile-ico">+</div><div class="tile-name">Нэмэх</div>`;
  add.addEventListener("click", ()=> openBookmarkEditor());
  wrap.appendChild(add);
}

function tickClock(){
  const now = new Date();
  document.getElementById("clockEl").textContent =
    now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  document.getElementById("dateEl").textContent =
    now.toLocaleDateString("mn-MN", {weekday:"long", year:"numeric", month:"long", day:"numeric"});
}
setInterval(tickClock, 1000*15);

function enterHome(){
  lockScreen.classList.remove("active");
  homeScreen.classList.add("active");
  applyAppearance();
  renderTiles();
  tickClock();
  document.getElementById("addrInput").value="";
}
function lockNow(){
  vault=null; cryptoKey=null; pinBuffer="";
  homeScreen.classList.remove("active");
  closePanel();
  bootLock();
  lockScreen.classList.add("active");
}
document.getElementById("lockBtn").addEventListener("click", lockNow);

/* ---- navigation logic ---- */
function looksLikeUrl(q){
  if(/^[a-z]+:\/\//i.test(q)) return true;
  if(/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?$/.test(q)) return true;
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/i.test(q) && !q.includes(" ")) return true;
  return false;
}
function navigateTo(raw){
  const q = raw.trim();
  if(!q) return;
  let target;
  if(looksLikeUrl(q)){
    target = /^[a-z]+:\/\//i.test(q) ? q : "https://"+q;
  }else{
    const tmpl = vault.engine==="custom" ? vault.customEngineUrl : ENGINES[vault.engine]?.url;
    if(!tmpl){ showToast("Хайлтын систем тохируулаагүй байна"); return; }
    target = tmpl.replace("%s", encodeURIComponent(q));
  }
  // In a plain browser tab this just navigates away (leaving the vault).
  // When wrapped as a WebView app, this is what lets the app actually browse the web.
  window.location.href = target;
}
document.getElementById("goBtn").addEventListener("click", ()=> navigateTo(document.getElementById("addrInput").value));
document.getElementById("addrInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") navigateTo(e.target.value);
});

/* ================= settings panel ================= */
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
const panelBody = document.getElementById("panelBody");
const panelTitle = document.getElementById("panelTitle");

function openPanel(title){
  panelTitle.textContent = title;
  overlay.classList.add("active");
  panel.classList.add("active");
}
function closePanel(){
  overlay.classList.remove("active");
  panel.classList.remove("active");
}
overlay.addEventListener("click", closePanel);
document.getElementById("panelClose").addEventListener("click", closePanel);

document.getElementById("settingsBtn").addEventListener("click", openSettings);

function openSettings(){
  panelBody.innerHTML = "";
  panelBody.appendChild(buildAppearanceSection());
  panelBody.appendChild(buildSearchSection());
  panelBody.appendChild(buildBookmarksSection());
  panelBody.appendChild(buildSecuritySection());
  openPanel("Тохиргоо");
}

function sectionShell(title){
  const s = document.createElement("div");
  const h = document.createElement("div");
  h.className="section-title"; h.textContent=title;
  s.appendChild(h);
  return s;
}

function buildAppearanceSection(){
  const s = sectionShell("Гадаад төрх");

  const sw = document.createElement("div");
  sw.className="swatches";
  ACCENTS.forEach(c=>{
    const el = document.createElement("div");
    el.className="swatch"+(vault.accent===c?" sel":"");
    el.style.background=c;
    el.addEventListener("click", ()=>{ vault.accent=c; saveVault(); applyAppearance(); openSettings(); });
    sw.appendChild(el);
  });
  s.appendChild(sw);

  const spacer = document.createElement("div"); spacer.style.height="14px"; s.appendChild(spacer);

  const fileBtn = document.createElement("label");
  fileBtn.className="file-btn";
  fileBtn.textContent = vault.bgMode==="image" ? "Дэвсгэр зураг солих" : "Дэвсгэр зураг оруулах";
  const fileInput = document.createElement("input");
  fileInput.type="file"; fileInput.accept="image/*"; fileInput.style.display="none";
  fileInput.addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      vault.bgImage = reader.result;
      vault.bgMode = "image";
      await saveVault();
      applyAppearance();
      showToast("Дэвсгэр хадгалагдлаа");
      openSettings();
    };
    reader.readAsDataURL(f);
  });
  fileBtn.appendChild(fileInput);
  s.appendChild(fileBtn);

  if(vault.bgMode==="image"){
    const clr = document.createElement("div");
    clr.style.marginTop="8px";
    const b = document.createElement("button");
    b.className="btn btn-ghost"; b.style.width="100%"; b.textContent="Энгийн дэвсгэр рүү буцах";
    b.addEventListener("click", async ()=>{ vault.bgMode="plain"; vault.bgImage=""; await saveVault(); applyAppearance(); openSettings(); });
    clr.appendChild(b); s.appendChild(clr);
  }
  return s;
}

function buildSearchSection(){
  const s = sectionShell("Хайлтын систем");
  const sel = document.createElement("select");
  Object.entries(ENGINES).forEach(([k,v])=>{
    const o=document.createElement("option"); o.value=k; o.textContent=v.name;
    if(vault.engine===k) o.selected=true;
    sel.appendChild(o);
  });
  const co = document.createElement("option"); co.value="custom"; co.textContent="Custom URL";
  if(vault.engine==="custom") co.selected=true;
  sel.appendChild(co);
  sel.addEventListener("change", async ()=>{ vault.engine=sel.value; await saveVault(); applyAppearance(); customWrap.style.display = sel.value==="custom" ? "flex":"none"; });
  s.appendChild(sel);

  const customWrap = document.createElement("div");
  customWrap.className="field"; customWrap.style.marginTop="10px";
  customWrap.style.display = vault.engine==="custom" ? "flex":"none";
  customWrap.innerHTML = `<label>Custom template (%s = query)</label>`;
  const ci = document.createElement("input");
  ci.type="text"; ci.placeholder="https://example.com/search?q=%s";
  ci.value = vault.customEngineUrl||"";
  ci.addEventListener("change", async ()=>{ vault.customEngineUrl=ci.value.trim(); await saveVault(); applyAppearance(); });
  customWrap.appendChild(ci);
  s.appendChild(customWrap);

  const hint = document.createElement("p");
  hint.className="hint"; hint.style.marginTop="10px";
  hint.textContent = "Хайлт хийхэд зөвхөн таны сонгосон хайлтын системд шууд хандах бөгөөд энэ апп өөрөө ямар ч аналитик, tracker илгээдэггүй.";
  s.appendChild(hint);
  return s;
}

function buildBookmarksSection(){
  const s = sectionShell("Хурдан холбоосууд");
  const list = document.createElement("div");
  list.className="bm-list";
  vault.bookmarks.forEach((bm, idx)=>{
    const row = document.createElement("div");
    row.className="bm-row";
    row.innerHTML = `<div class="dot" style="background:${bm.color}"></div>
      <div class="info"><b>${escapeHtml(bm.name)}</b><small>${escapeHtml(bm.url)}</small></div>
      <div class="del">✕</div>`;
    row.querySelector(".del").addEventListener("click", async (e)=>{
      e.stopPropagation();
      vault.bookmarks.splice(idx,1);
      await saveVault();
      renderTiles();
      openSettings();
    });
    list.appendChild(row);
  });
  s.appendChild(list);

  const addBtn = document.createElement("button");
  addBtn.className="btn btn-ghost"; addBtn.style.width="100%"; addBtn.style.marginTop="10px";
  addBtn.textContent="+ Шинэ холбоос нэмэх";
  addBtn.addEventListener("click", openBookmarkEditor);
  s.appendChild(addBtn);
  return s;
}

function buildSecuritySection(){
  const s = sectionShell("Аюулгүй байдал");

  const changePin = document.createElement("button");
  changePin.className="btn btn-ghost"; changePin.style.width="100%";
  changePin.textContent="PIN солих";
  changePin.addEventListener("click", openChangePin);
  s.appendChild(changePin);

  const spacer=document.createElement("div"); spacer.style.height="8px"; s.appendChild(spacer);

  const wipe = document.createElement("button");
  wipe.className="btn btn-danger"; wipe.style.width="100%";
  wipe.textContent="Бүх өгөгдлийг устгах";
  wipe.addEventListener("click", ()=>{
    if(confirm("Vault болон бүх тохиргоо, холбоосыг бүрмөсөн устгах уу? Энэ үйлдлийг буцаах боломжгүй.")){
      localStorage.removeItem(LS_META);
      localStorage.removeItem(LS_BLOB);
      lockNow();
      showToast("Устгагдлаа");
    }
  });
  s.appendChild(wipe);

  const hint = document.createElement("p");
  hint.className="hint"; hint.style.marginTop="10px";
  hint.textContent = "Бүх тохиргоо, закладка нь таны PIN-ээс гарган авсан түлхүүрээр AES-GCM ашиглан төхөөрөмж дээр л шифрлэгдэж хадгалагдана. Юу ч сервер рүү илгээгдэхгүй.";
  s.appendChild(hint);
  return s;
}

function openChangePin(){
  panelBody.innerHTML="";
  const s = sectionShell("PIN солих");
  s.innerHTML += `
    <div class="field"><label>Одоогийн PIN</label><input type="password" id="curPin" inputmode="numeric" maxlength="8"></div>
    <div class="field" style="margin-top:10px;"><label>Шинэ PIN</label><input type="password" id="newPin" inputmode="numeric" maxlength="8"></div>
    <div class="field" style="margin-top:10px;"><label>Шинэ PIN давтах</label><input type="password" id="newPin2" inputmode="numeric" maxlength="8"></div>
    <div id="cpErr" class="lock-msg err" style="margin-top:8px;"></div>
  `;
  const btn = document.createElement("button");
  btn.className="btn btn-accent"; btn.style.width="100%"; btn.style.marginTop="12px";
  btn.textContent="Хадгалах";
  btn.addEventListener("click", async ()=>{
    const cur = document.getElementById("curPin").value.trim();
    const n1 = document.getElementById("newPin").value.trim();
    const n2 = document.getElementById("newPin2").value.trim();
    const err = document.getElementById("cpErr");
    const meta = JSON.parse(localStorage.getItem(LS_META));
    try{
      const curKey = await deriveKey(cur, meta.salt);
      await decryptJSON(curKey, JSON.parse(localStorage.getItem(LS_BLOB))); // verify
    }catch(e){ err.textContent="Одоогийн PIN буруу байна."; return; }
    if(!/^\d{4,8}$/.test(n1)){ err.textContent="Шинэ PIN 4–8 орон байх ёстой."; return; }
    if(n1!==n2){ err.textContent="Шинэ PIN таарахгүй байна."; return; }
    const newSalt = crypto.getRandomValues(new Uint8Array(16));
    const newSaltB64 = b64.enc(newSalt);
    const newKey = await deriveKey(n1, newSaltB64);
    cryptoKey = newKey;
    localStorage.setItem(LS_META, JSON.stringify({salt:newSaltB64}));
    await saveVault();
    showToast("PIN шинэчлэгдлээ");
    closePanel();
  });
  s.appendChild(btn);
  panelBody.appendChild(s);
  openPanel("PIN солих");
}

function openBookmarkEditor(){
  panelBody.innerHTML="";
  const s = sectionShell("Шинэ холбоос");
  s.innerHTML += `
    <div class="field"><label>Нэр</label><input type="text" id="bmName" placeholder="Жишээ: Gmail"></div>
    <div class="field" style="margin-top:10px;"><label>URL</label><input type="url" id="bmUrl" placeholder="https://..."></div>
  `;
  const sw = document.createElement("div");
  sw.className="swatches"; sw.style.marginTop="10px";
  let chosen = ACCENTS[0];
  ACCENTS.forEach((c,i)=>{
    const el=document.createElement("div");
    el.className="swatch"+(i===0?" sel":"");
    el.style.background=c;
    el.addEventListener("click", ()=>{
      sw.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); chosen=c;
    });
    sw.appendChild(el);
  });
  s.appendChild(sw);

  const btn = document.createElement("button");
  btn.className="btn btn-accent"; btn.style.width="100%"; btn.style.marginTop="14px";
  btn.textContent="Нэмэх";
  btn.addEventListener("click", async ()=>{
    const name = document.getElementById("bmName").value.trim();
    let url = document.getElementById("bmUrl").value.trim();
    if(!name || !url){ showToast("Нэр болон URL-г бөглөнө үү"); return; }
    if(!/^[a-z]+:\/\//i.test(url)) url = "https://"+url;
    vault.bookmarks.push({name, url, color:chosen});
    await saveVault();
    renderTiles();
    showToast("Нэмэгдлээ");
    openSettings();
  });
  s.appendChild(btn);
  panelBody.appendChild(s);
  openPanel("Холбоос нэмэх");
}

/* ================= misc ================= */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 1600);
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ================= go ================= */
bootLock();
})();
</script>
